<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(5, 20, 5, 0.88);
      --line: #143514;
      --green: #00ff66;
      --green-soft: #7cffb0;
      --danger: #ff4f70;
      --shadow: rgba(0,255,102,0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)),
        url("/image.png") center/cover no-repeat;
      color: var(--green-soft);
      font-family: "Share Tech Mono", monospace;
    }

    .terminal {
      width: min(92vw, 560px);
      border: 1px solid var(--green);
      background: var(--panel);
      box-shadow:
        0 0 0 1px rgba(0,255,102,0.15),
        0 0 26px var(--shadow);
    }

    .bar {
      display: flex;
      gap: 6px;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,0.4);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .body {
      padding: 1.5rem;
    }

    .prompt {
      color: var(--green);
      margin-bottom: 0.5rem;
    }

    .code {
      font-size: 3rem;
      color: var(--danger);
      margin: 0;
    }

    .text {
      margin: 0.5rem 0 1rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    a {
      text-decoration: none;
      padding: 0.7rem 1rem;
      border: 1px solid var(--green);
      color: var(--green);
    }

    a:hover {
      background: rgba(0,255,102,0.1);
    }
  </style>
</head>
<body>
  <main class="terminal">
    <div class="bar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <div class="body">
      <div class="prompt">&gt; locate_resource --path</div>
      <h1 class="code">404</h1>
      <p class="text">
        Target resource not found. The requested path does not exist in the system.
      </p>
      <div class="actions">
        <a href="/">Home</a>
        <a href="/login">Login</a>
      </div>
    </div>
  </main>
</body>
</html>
