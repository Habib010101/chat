<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(5, 20, 5, 0.88);
      --line: #143514;
      --green: #00ff66;
      --green-soft: #7cffb0;
      --green-dim: #23b35f;
      --text: #d9ffe7;
      --shadow: rgba(0, 255, 102, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Share Tech Mono", monospace;
      overflow: hidden;
    }

    .matrix {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(0, 255, 102, 0.08), transparent 45%),
        repeating-linear-gradient(0deg, rgba(0,255,102,0.05) 0px, rgba(0,255,102,0.05) 1px, transparent 1px, transparent 28px),
        repeating-linear-gradient(90deg, rgba(0,255,102,0.035) 0px, rgba(0,255,102,0.035) 1px, transparent 1px, transparent 28px);
      pointer-events: none;
    }

    .terminal {
      position: relative;
      width: min(92vw, 520px);
      border: 1px solid var(--green-dim);
      background: var(--panel);
      box-shadow:
        0 0 0 1px rgba(0, 255, 102, 0.15),
        0 0 26px var(--shadow),
        inset 0 0 40px rgba(0, 255, 102, 0.04);
      z-index: 1;
      text-align: center;
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.35);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green-dim);
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.45);
    }

    .terminal-title {
      margin-left: auto;
      color: var(--green-soft);
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .terminal-body {
      padding: 2rem 1.5rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 5vw, 2.6rem);
      color: var(--green);
    }

    .sub {
      margin-bottom: 2rem;
      color: var(--green-soft);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .button {
      padding: 0.9rem 1.2rem;
      border: 1px solid var(--green);
      background: linear-gradient(180deg, rgba(0,255,102,0.16), rgba(0,255,102,0.08));
      color: var(--green);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.25s ease;
    }

    .button:hover {
      background: linear-gradient(180deg, rgba(0,255,102,0.22), rgba(0,255,102,0.1));
    }

    .footer {
      margin-top: 2rem;
      color: rgba(124, 255, 176, 0.7);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="matrix"></div>

  <main class="terminal">
    <div class="terminal-bar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="terminal-title">root@chat-secure:~/home</span>
    </div>

    <div class="terminal-body">
      <h1>Secure Chat</h1>
      <p class="sub">
        Access the system. Authenticate or create a new operator profile to enter the network.
      </p>

      <div class="actions">
        <a href="/login" class="button">Login</a>
        <a href="/register" class="button">Register</a>
      </div>

      <p class="footer">system://ready · awaiting input</p>
    </div>
  </main>
</body>
</html>
