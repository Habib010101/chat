<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(5, 20, 5, 0.88);
      --line: #143514;
      --green: #00ff66;
      --green-soft: #7cffb0;
      --green-dim: #23b35f;
      --text: #d9ffe7;
      --danger: #ff4f70;
      --shadow: rgba(0, 255, 102, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Share Tech Mono", monospace;
      overflow: hidden;
    }

    .matrix {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(0, 255, 102, 0.08), transparent 45%),
        repeating-linear-gradient(0deg, rgba(0,255,102,0.05) 0px, rgba(0,255,102,0.05) 1px, transparent 1px, transparent 28px),
        repeating-linear-gradient(90deg, rgba(0,255,102,0.035) 0px, rgba(0,255,102,0.035) 1px, transparent 1px, transparent 28px);
      pointer-events: none;
    }

    .matrix::before {
      content: "01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101 01001000 01000001 01000011 01001011 01000101 01010010 00100000 01001101 01001111 01000100 01000101";
      position: absolute;
      inset: 0;
      color: rgba(0, 255, 102, 0.1);
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 2.1;
      letter-spacing: 3px;
      padding: 2rem;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .home-button {
      margin-left: 1rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--green-dim);
      color: var(--green-soft);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    
    .home-button:hover {
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 6px rgba(0, 255, 102, 0.4);
    }

    .terminal {
      position: relative;
      width: min(92vw, 480px);
      border: 1px solid var(--green-dim);
      background: var(--panel);
      box-shadow:
        0 0 0 1px rgba(0, 255, 102, 0.15),
        0 0 26px var(--shadow),
        inset 0 0 40px rgba(0, 255, 102, 0.04);
      z-index: 1;
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.35);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green-dim);
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.45);
    }

    .terminal-title {
      margin-left: auto;
      color: var(--green-soft);
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .terminal-body {
      padding: 1.4rem 1.2rem 1.25rem;
    }

    .prompt {
      color: var(--green);
      margin-bottom: 0.35rem;
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      color: var(--green);
    }

    form {
      display: grid;
      gap: 1rem;
    }

    label {
      display: grid;
      gap: 0.42rem;
      color: var(--green-soft);
      font-size: 0.92rem;
    }

    input {
      width: 100%;
      padding: 0.85rem 0.9rem;
      border: 1px solid var(--green-dim);
      outline: none;
      background: rgba(0, 0, 0, 0.45);
      color: var(--text);
    }

    input:focus {
      border-color: var(--green);
    }

    .error {
      min-height: 1.2em;
      color: var(--danger);
      font-size: 0.85rem;
    }

    button {
      margin-top: 0.3rem;
      padding: 0.9rem 1rem;
      border: 1px solid var(--green);
      background: linear-gradient(180deg, rgba(0,255,102,0.16), rgba(0,255,102,0.08));
      color: var(--green);
      font: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    button:disabled {
      background: gray;
      color: #aaa;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .footer {
      margin-top: 1rem;
      color: rgba(124, 255, 176, 0.75);
      font-size: 0.82rem;
    }

    .footer a {
      color: var(--green);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="matrix"></div>
  <main class="terminal">
    <a href="/" class="home-button">HOME</a>
    <div class="terminal-bar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="terminal-title">root@chat-secure:~/login</span>
    </div>

    <div class="terminal-body">
      <div class="prompt">&gt; authenticate_user.exe</div>
      <h1>Login</h1>

      <form id="login-form" novalidate>
        <label for="username">
          Username
          <input id="username" type="text" required />
        </label>

        <label for="password">
          Password
          <input id="password" type="password" required />
        </label>

        <p id="error" class="error" style="color: red; font-size: 0.8rem;"></p>

        <button id="submit" type="submit">Login</button>
      </form>

      <p class="footer">No access? <a href="/register">Register</a></p>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
